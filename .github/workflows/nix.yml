name: Nix

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  home-manager:
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - macos-26
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Scan secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          trivy-config: trivy.yaml
          version: v0.72.0

      - name: Render chezmoi templates
        shell: bash
        run: |
          set -euo pipefail
          destination="$RUNNER_TEMP/home"
          mkdir -p "$destination"
          nixpkgs_rev=$(jq -r '.nodes.nixpkgs.locked.rev' dot_config/nix/flake.lock)
          nix run "github:NixOS/nixpkgs/$nixpkgs_rev#chezmoi" -- \
            --source "$GITHUB_WORKSPACE" \
            --destination "$destination" \
            --no-tty \
            apply --exclude scripts

      - name: Check flake
        shell: bash
        run: nix flake check "$RUNNER_TEMP/home/.config/nix"

      - name: Check mise tools
        shell: bash
        run: |
          set -euo pipefail
          destination="$RUNNER_TEMP/home"
          nixpkgs_rev=$(jq -r '.nodes.nixpkgs.locked.rev' dot_config/nix/flake.lock)
          MISE_GLOBAL_CONFIG_FILE="$destination/.config/mise/config.toml" \
          MISE_GLOBAL_CONFIG_ROOT="$destination" \
          MISE_DATA_DIR="$RUNNER_TEMP/mise" \
            nix run "github:NixOS/nixpkgs/$nixpkgs_rev#mise" -- install --dry-run

      - name: Build Home Manager activation package
        shell: bash
        run: nix build "$RUNNER_TEMP/home/.config/nix#homeConfigurations.default.activationPackage"
